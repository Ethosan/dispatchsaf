<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="3; url=https://dispatchsaf.ethantam.dev">
<title>Dispatch — Moved</title>
<style>
  :root { color-scheme: light dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f3f4f6; color: #111827; padding: 24px;
  }
  @media (prefers-color-scheme: dark) { body { background: #111827; color: #f9fafb; } }
  .card {
    max-width: 420px; text-align: center; padding: 48px 32px;
    background: #fff; border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  @media (prefers-color-scheme: dark) { .card { background: #1f2937; } }
  .icon { font-size: 48px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin-bottom: 8px; }
  p { font-size: 15px; line-height: 1.6; color: #6b7280; margin-bottom: 24px; }
  @media (prefers-color-scheme: dark) { p { color: #9ca3af; } }
  a.btn {
    display: inline-block; padding: 12px 28px; border-radius: 10px;
    background: #2563eb; color: #fff; text-decoration: none;
    font-weight: 600; font-size: 15px;
    transition: background 0.15s ease;
  }
  a.btn:hover { background: #1d4ed8; }
  a.btn:active { transform: scale(0.97); }
  .auto { font-size: 13px; color: #9ca3af; margin-top: 16px; }
  @media (prefers-color-scheme: dark) { .auto { color: #6b7280; } }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px; background: #e5e7eb; padding: 2px 6px; border-radius: 4px;
  }
  @media (prefers-color-scheme: dark) { code { background: #374151; } }
</style>
</head>
<body>
<div class="card">
  <div class="icon">&#x1F4E6;</div>
  <h1>Dispatch has moved</h1>
  <p>This app is now hosted at<br><code>dispatchsaf.pages.dev</code></p>
  <a class="btn" href="https://dispatchsaf.ethantam.dev">Open Dispatch</a>
  <p class="auto">Redirecting automatically in 3 seconds&hellip;</p>
</div>
<script>setTimeout(function(){ window.location.href = "https://dispatchsaf.ethantam.dev"; }, 3000);</script>
</body>
</html>
